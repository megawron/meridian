[options]
library = "Camel"
version = "1.2"
min_cfg_version = "1.2"
target_path = "../../target/eds-bindings/camel"
girs_directories = ["/usr/share/gir-1.0"]
work_mode = "normal"
generate_safety_asserts = true

[dependencies]
glib = "0.20"
gio = "0.20"

[[object]]
name = "Camel.Session"
status = "generate"

[[object]]
name = "Camel.Store"
status = "generate"

[[object]]
name = "Camel.Folder"
status = "generate"

[[object]]
name = "Camel.MimeMessage"
status = "generate"

[[object]]
name = "Camel.MessageInfo"
status = "generate"
