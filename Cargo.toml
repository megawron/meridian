[workspace]
members = ["src", "tests"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["megawron"]
repository = "https://github.com/megawron/meridian"
description = "A modern GTK4/libadwaita mail and groupware client powered by Evolution Data Server"

[workspace.dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_16"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_6"] }
glib = { version = "0.20", features = ["v2_80"] }
gio = { version = "0.20", features = ["v2_80"] }
gdk = { package = "gdk4", version = "0.9" }
gdk-pixbuf = "0.20"
webkit6 = "0.4"
javascriptcore6 = "0.4"
pango = "0.20"
zbus = "5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
async-channel = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
gettext-rs = { version = "0.8", features = ["gettext-system"] }
regex = "1.11"
