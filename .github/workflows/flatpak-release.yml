name: Release

# Builds the release packages for x86_64 and aarch64 and publishes them:
#   - Build jobs:   RPM and signed Flatpak bundle + repository (one job per architecture)
#   - Publish job:  merges both Flatpak repositories into one, uploads everything to
#                   the GitHub release (created if missing) and deploys the Flatpak
#                   repository to gh-pages.
#
# Trigger from any machine:
#   gh workflow run flatpak-release.yml -f tag=v0.1.0-beta.1
# or via "Actions → Release → Run workflow" on GitHub.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0-beta.1). Must already exist.'
        required: true
      notes:
        description: 'Release notes (only used when the release is created)'
        required: false
        default: 'First public beta release.'

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    container:
      image: registry.fedoraproject.org/fedora:44
      # flatpak build-export validates icons in a bwrap sandbox, which needs user namespaces
      options: --privileged
      env:
        PATH: /root/.cargo/bin:/github/home/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git tar gzip curl gcc gcc-c++ pkgconf-pkg-config \
            evolution-data-server-devel gtk4-devel libadwaita-devel \
            webkitgtk6.0-devel sqlite-devel gettext rpm-build file \
            flatpak gnupg2 python3 glib2
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Import Flatpak signing key
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$FLATPAK_GPG_PRIVATE_KEY" ]; then
            printf '%s\n' "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import
          else
            echo "::warning::FLATPAK_GPG_PRIVATE_KEY not set, Flatpak repo will be unsigned"
          fi

      - name: Build release binary
        run: cargo build --release --locked --bin meridian

      - name: Build packages
        shell: bash
        run: |
          chmod +x scripts/build-packages.sh
          ./scripts/build-packages.sh flatpak "${{ inputs.tag }}"
          ./scripts/build-packages.sh rpm "${{ inputs.tag }}"
          tar -C packaging/out -czf packaging/out/flatpak-repo-${{ matrix.arch }}.tar.gz flatpak-repo
          ls -lh packaging/out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: |
            packaging/out/*.rpm
            packaging/out/*.flatpak
            packaging/out/flatpak-repo-*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [build]
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:44
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag }}
      FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
    steps:
      - name: Install tooling
        run: dnf install -y --setopt=install_weak_deps=False git tar gzip flatpak ostree gnupg2 gh

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Trust workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Import Flatpak signing key
        run: |
          if [ -n "$FLATPAK_GPG_PRIVATE_KEY" ]; then
            printf '%s\n' "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Merge Flatpak repositories
        run: |
          for arch in x86_64 aarch64; do
            mkdir -p "repos/$arch"
            tar -C "repos/$arch" -xzf "dist/flatpak-repo-$arch.tar.gz"
            rm "dist/flatpak-repo-$arch.tar.gz"
          done
          ./scripts/build-packages.sh merge-repos repos/x86_64/flatpak-repo repos/aarch64/flatpak-repo
          mkdir -p packaging/out
          cp -a repos/x86_64/flatpak-repo packaging/out/flatpak-repo

      - name: Prepare release files
        run: |
          ( cd dist && sha256sum * > SHA256SUMS.txt )
          ls -lh dist

      - name: Create or update GitHub release
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            prerelease=""
            case "$TAG" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" $prerelease \
              --title "Meridian ${TAG#v}" \
              --notes "${{ inputs.notes }}"
          fi
          gh release upload "$TAG" dist/* --clobber

      - name: Publish Flatpak repository to gh-pages
        env:
          GH_PAGES_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/build-packages.sh publish-repo "$TAG"
