name: Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag, branch, or SHA to build'
        required: false
        default: 'main'

permissions:
  contents: write

jobs:
  rpm:
    name: Fedora x86_64 RPM
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:41
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git tar gzip curl gcc gcc-c++ pkgconf-pkg-config \
            evolution-data-server-devel gtk4-devel libadwaita-devel \
            webkitgtk6.0-devel sqlite-devel gettext rpm-build file
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Build RPM package
        shell: bash
        run: |
          chmod +x scripts/build-packages.sh
          ./scripts/build-packages.sh rpm "${{ github.ref_name }}"
          ls -lh packaging/out/*.rpm

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: meridian-rpm-x86_64
          path: packaging/out/meridian-*.rpm
          if-no-files-found: error

  deb:
    name: Debian / Ubuntu amd64 DEB
    runs-on: ubuntu-24.04
    container: docker.io/library/debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git tar gzip build-essential pkg-config dpkg-dev gettext file \
            libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev \
            libcamel1.2-dev libedataserver1.2-dev libecal2.0-dev \
            libebook1.2-dev libebook-contacts1.2-dev libsqlite3-dev
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Build DEB package and Flatpak stage
        shell: bash
        run: |
          chmod +x scripts/build-packages.sh
          ./scripts/build-packages.sh deb-and-flatpak-stage "${{ github.ref_name }}"
          ls -lh packaging/out/*.deb packaging/out/flatpak-app.tar.gz

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: meridian-deb-amd64
          path: packaging/out/meridian_*.deb
          if-no-files-found: error

      - name: Upload Flatpak stage
        uses: actions/upload-artifact@v4
        with:
          name: meridian-flatpak-stage
          path: packaging/out/flatpak-app.tar.gz
          if-no-files-found: error

  flatpak:
    name: Flatpak x86_64 Bundle
    needs: deb
    runs-on: ubuntu-24.04
    steps:
      - name: Install Flatpak & OSTree
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak ostree

      - name: Download staged payload
        uses: actions/download-artifact@v4
        with:
          name: meridian-flatpak-stage

      - name: Package Flatpak bundle
        run: |
          ref="${{ github.event.inputs.ref || github.ref_name }}"
          case "$ref" in
            *-beta*) bundle="Meridian-Beta-x86_64.flatpak" ;;
            *)       bundle="Meridian-x86_64.flatpak" ;;
          esac

          flatpak build-init build-dir com.martingawron.Meridian org.gnome.Sdk org.gnome.Platform 48
          tar -xzf flatpak-app.tar.gz
          cp -a flatpak-app/* build-dir/files/

          flatpak build-finish build-dir \
            --command=meridian \
            --share=ipc \
            --share=network \
            --socket=fallback-x11 \
            --socket=wayland \
            --device=dri \
            --talk-name=org.gnome.evolution.dataserver.Sources5 \
            --talk-name=org.gnome.evolution.dataserver.Calendar8 \
            --talk-name=org.gnome.evolution.dataserver.AddressBook10 \
            --talk-name=org.gnome.evolution.dataserver.Subprocess.Backend.* \
            --talk-name=org.gnome.OnlineAccounts \
            --talk-name=org.freedesktop.Notifications \
            --talk-name=org.freedesktop.secrets \
            --filesystem=xdg-run/gvfsd \
            --metadata=X-DConf=migrate-path=/com/martingawron/meridian/

          flatpak build-export repo build-dir
          flatpak build-bundle repo "$bundle" com.martingawron.Meridian \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

          mkdir -p dist
          mv "$bundle" dist/
          ls -lh dist/

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: meridian-flatpak-x86_64
          path: dist/*.flatpak
          if-no-files-found: error

  release:
    name: Publish GitHub Release Assets
    needs: [rpm, deb, flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          pattern: meridian-*
          merge-multiple: true
          path: release-assets

      - name: Prepare checksums
        run: |
          cd release-assets
          rm -f flatpak-app.tar.gz
          sha256sum * > SHA256SUMS.txt
          ls -lh

      - name: Attach packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.rpm
            release-assets/*.deb
            release-assets/*.flatpak
            release-assets/SHA256SUMS.txt
